# BoT-SORT Tracker Configuration
# Calibrated for Aerial Drone Surveillance & Multi-Road Urban Traffic
# GOAL: Eliminate cross-road ID jumps, prevent ghost tracks across buildings, and maintain tight local track stability.

tracker_type: botsort
track_high_thresh: 0.18  # High confidence detection threshold (Stage 1)
track_low_thresh: 0.05   # Low confidence recovery threshold (Stage 2)
new_track_thresh: 0.30   # Threshold to initialize a new track
track_buffer: 20         # Frames to keep lost track alive (~0.6s at 30fps) - tight buffer prevents cross-road jumps
match_thresh: 0.45       # Strict matching threshold - forbids distant box associations
fuse_score: False        # Pure geometric & optical flow matching for aerial accuracy

# Camera Motion Compensation (GMC) - essential for drone hover/wind drift
gmc_method: sparseOptFlow

# Appearance / Spatial Gating
proximity_thresh: 0.35
appearance_thresh: 0.25
with_reid: false
model: auto
